name: Build and Publish Devcontainer Image

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
      - master
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yml'
  schedule:
    - cron: '0 4 * * 0'  # 4 AM UTC every Sunday – weekly health check rebuild

permissions:
  contents: read
  packages: write  # push to GHCR

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image ref
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${REPO}/devcontainer:latest" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push devcontainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          # Layer cache backed by GitHub Actions cache storage
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Health check – run cargo test
        run: |
          echo "=== Running cargo test inside devcontainer image ==="
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e CARGO_HOME=/tmp/cargo \
            -e CARGO_TARGET_DIR=/tmp/target \
            "${{ steps.image.outputs.ref }}" \
            bash -lc "cargo test --lib --workspace 2>&1"
          echo "=== Health check passed ==="

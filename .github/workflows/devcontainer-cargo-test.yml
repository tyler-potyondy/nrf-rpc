name: Devcontainer cargo test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    # Nightly test with precompiled binaries (fast validation)
    - cron: '0 2 * * *'  # 2 AM UTC daily
    # Weekly source build to validate toolchain
    - cron: '0 3 * * 0'  # 3 AM UTC on Sundays

env:
  # Force source build on weekly schedule or if setup files changed
  FORCE_SOURCE_BUILD: ${{ (github.event.schedule == '0 3 * * 0') || contains(github.event.head_commit.modified, '.github/workflows/') || contains(github.event.head_commit.modified, 'tests/zephyr_setup.sh') }}

jobs:
  cargo-test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          # Show initial disk usage
          echo "=== Initial Disk Usage ==="
          df -h
          
          # Remove unnecessary preinstalled software
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean Docker
          docker system prune -af --volumes || true
          
          # Show disk usage after cleanup
          echo "=== After Cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Setup swap space
        run: |
          # Remove existing swapfile if present
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile

          # Create new swap
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Get nrf submodule SHA for cache key
        id: nrf-sha
        run: echo "sha=$(git submodule status tests/external/nrf | awk '{print $1}' | tr -d '+-' | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Download precompiled BabbleSim binaries
        if: env.FORCE_SOURCE_BUILD != 'true'
        run: |
          echo "Attempting to download precompiled binaries..."
          # Try to download from latest release
          RELEASE_TAG="bsim-${{ steps.nrf-sha.outputs.sha }}-"
          
          # Find latest matching release
          ASSET_URL=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r ".[] | select(.tag_name | startswith(\"${RELEASE_TAG}\")) | .assets[] | select(.name == \"bsim-binaries.tar.gz\") | .browser_download_url" \
            | head -n1)
          
          if [ -n "$ASSET_URL" ]; then
            echo "✓ Downloading from release: $ASSET_URL"
            curl -L -o bsim-binaries.tar.gz "$ASSET_URL"
          else
            echo "::warning::No precompiled binaries found for SHA ${{ steps.nrf-sha.outputs.sha }}"
            echo "::notice::Building from source. To speed up future runs, trigger 'Build BabbleSim Binaries' workflow."
            echo "NEED_BUILD=true" >> $GITHUB_ENV
          fi

      - name: Download forced (nightly/setup changed)
        if: env.FORCE_SOURCE_BUILD == 'true'
        run: |
          echo "::notice::Force building from source (nightly or setup changed)"
          echo "NEED_BUILD=true" >> $GITHUB_ENV

      - name: Extract binaries
        if: env.NEED_BUILD != 'true'
        run: |
          mkdir -p tests/external/tools/bsim
          tar -xzf bsim-binaries.tar.gz -C tests/external/tools/bsim
          
      - name: Verify binaries
        if: env.NEED_BUILD != 'true'
        run: |
          ls -lh tests/external/tools/bsim/bin/
          chmod +x tests/external/tools/bsim/bin/*
          
          # Install required libraries
          echo "Installing runtime dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y libglib2.0-0 || true
          
          # Check library dependencies
          ldd tests/external/tools/bsim/bin/bs_2G4_phy_v1 || echo "Warning: library check failed"

      - name: Build devcontainer image (only if needed)
        if: env.NEED_BUILD == 'true'
        run: |
          docker build \
            --file .devcontainer/Dockerfile \
            --platform linux/amd64 \
            --tag nrf-rpc-dev \
            .

      - name: Fix workspace permissions for container user
        if: env.NEED_BUILD == 'true'
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Run Zephyr setup (fallback if no precompiled binaries)
        if: env.NEED_BUILD == 'true'
        run: |
          docker run --rm \
            --memory=6g \
            --memory-swap=14g \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            nrf-rpc-dev \
            bash -lc "cd tests && echo y | ./zephyr_setup.sh"
      
      - name: Restore workspace permissions for runner
        if: env.NEED_BUILD == 'true'
        run: sudo chown -R runner:runner "$GITHUB_WORKSPACE"
      
      - name: Final binary verification
        run: |
          echo "=== Checking for required binaries ==="
          ls -lh tests/external/tools/bsim/bin/ || (echo "ERROR: BabbleSim bin directory not found" && exit 1)
          
          test -f tests/external/tools/bsim/bin/bs_2G4_phy_v1 && echo "✓ bs_2G4_phy_v1 found" || (echo "✗ bs_2G4_phy_v1 missing" && exit 1)
          test -f tests/external/tools/bsim/bin/zephyr_rpc_server_app && echo "✓ zephyr_rpc_server_app found" || (echo "✗ zephyr_rpc_server_app missing" && exit 1)
          test -f tests/external/tools/bsim/bin/cgm_peripheral_sample && echo "✓ cgm_peripheral_sample found" || (echo "✗ cgm_peripheral_sample missing" && exit 1)
          
          # Test binary execution
          tests/external/tools/bsim/bin/bs_2G4_phy_v1 -h > /dev/null 2>&1 && echo "✓ bs_2G4_phy_v1 executable" || echo "⚠ bs_2G4_phy_v1 may need libraries"
          
          echo "=== Binary check complete ==="

      - name: Build devcontainer image for tests
        run: |
          docker build \
            --file .devcontainer/Dockerfile \
            --platform linux/amd64 \
            --tag nrf-rpc-dev \
            .

      - name: Run cargo test in container
        run: |
          docker run --rm \
            --memory=6g \
            --memory-swap=14g \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            nrf-rpc-dev \
            bash -lc "export LD_LIBRARY_PATH=/workspace/tests/external/tools/bsim/lib:\$LD_LIBRARY_PATH && export BSIM_OUT_PATH=/workspace/tests/external/tools/bsim && cargo test --lib --workspace && cargo test --test integration_test"


  cargo-compile-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (compile test)
        run: cargo check --workspace --all-targets



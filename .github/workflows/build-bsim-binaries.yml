name: Build BabbleSim Binaries

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
      - master
    paths:
      - 'tests/zephyr_setup.sh'
      - '.github/workflows/build-bsim-binaries.yml'
      - 'tests/external/nrf'
  pull_request:
    paths:
      - 'tests/zephyr_setup.sh'
      - '.github/workflows/build-bsim-binaries.yml'
      - 'tests/external/nrf'

permissions:
  contents: write
  packages: read  # pull devcontainer image from GHCR

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set image ref
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${REPO}/devcontainer:latest" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build devcontainer image
        run: |
          IMAGE="${{ steps.image.outputs.ref }}"
          if docker pull "$IMAGE" 2>/dev/null; then
            docker tag "$IMAGE" nrf-rpc-dev
            echo "✓ Using cached devcontainer image from GHCR"
          else
            echo "::notice::No cached image found, building from source"
            docker build \
              --file .devcontainer/Dockerfile \
              --platform linux/amd64 \
              --tag nrf-rpc-dev \
              .
          fi
      
      - name: Fix workspace permissions for container user
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
      
      - name: Run Zephyr setup
        run: |
          docker run --rm \
            --memory=6g \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            nrf-rpc-dev \
            bash -lc "cd tests && ./zephyr_setup.sh --yes"
      
      - name: Restore workspace permissions for host
        run: sudo chown -R runner:runner "$GITHUB_WORKSPACE"
      
      - name: Package binaries
        run: |
          cd tests/external/tools/bsim
          chmod -R u+w bin/ lib/
          tar -czf bsim-binaries.tar.gz bin/ lib/
          mv bsim-binaries.tar.gz $GITHUB_WORKSPACE/
      
      - name: Get version info
        id: version
        run: |
          echo "sha=$(git submodule status tests/external/nrf | awk '{print $1}' | tr -d '+-' | cut -c1-8)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
      
      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsim-binaries-${{ steps.version.outputs.sha }}-${{ steps.version.outputs.date }}
          path: bsim-binaries.tar.gz
          retention-days: 90
      
      - name: Create Release (optional)
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: bsim-${{ steps.version.outputs.sha }}-${{ steps.version.outputs.date }}
          name: BabbleSim Binaries ${{ steps.version.outputs.sha }}
          files: bsim-binaries.tar.gz
          body: |
            Precompiled BabbleSim binaries
            - nRF submodule SHA: ${{ steps.version.outputs.sha }}
            - Build date: ${{ steps.version.outputs.date }}
            - Workflow: ${{ github.workflow }}
            - Run: ${{ github.run_number }}
            
            **Binaries included:**
            - bs_2G4_phy_v1
            - zephyr_rpc_server_app
            - cgm_peripheral_sample

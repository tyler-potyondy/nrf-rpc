name: Build BabbleSim Binaries

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'tests/zephyr_setup.sh'
      - '.github/workflows/build-bsim-binaries.yml'
  # Trigger when nrf submodule changes
  pull_request:
    paths:
      - 'tests/external/nrf'

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Build devcontainer image
        run: |
          docker build \
            --file .devcontainer/Dockerfile \
            --platform linux/amd64 \
            --tag nrf-rpc-dev \
            .
      
      - name: Fix workspace permissions for container user
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
      
      - name: Run Zephyr setup
        run: |
          docker run --rm \
            --memory=6g \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            nrf-rpc-dev \
            bash -lc "cd tests && echo y | ./zephyr_setup.sh"
      
      - name: Package binaries
        run: |
          cd tests/external/tools/bsim
          tar -czf bsim-binaries.tar.gz bin/ lib/
          mv bsim-binaries.tar.gz $GITHUB_WORKSPACE/
      
      - name: Get version info
        id: version
        run: |
          echo "sha=$(git submodule status tests/external/nrf | awk '{print $1}' | tr -d '+-' | cut -c1-8)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
      
      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsim-binaries-${{ steps.version.outputs.sha }}-${{ steps.version.outputs.date }}
          path: bsim-binaries.tar.gz
          retention-days: 90
      
      - name: Create Release (optional)
        uses: softprops/action-gh-release@v1
        if: github.event_name != 'pull_request'
        with:
          tag_name: bsim-${{ steps.version.outputs.sha }}-${{ steps.version.outputs.date }}
          name: BabbleSim Binaries ${{ steps.version.outputs.sha }}
          files: bsim-binaries.tar.gz
          body: |
            Precompiled BabbleSim binaries
            - nRF submodule SHA: ${{ steps.version.outputs.sha }}
            - Build date: ${{ steps.version.outputs.date }}
            - Workflow: ${{ github.workflow }}
            - Run: ${{ github.run_number }}
            
            **Binaries included:**
            - bs_2G4_phy_v1
            - zephyr_rpc_server_app
            - cgm_peripheral_sample
